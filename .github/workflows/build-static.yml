name: Deploy Next.js site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - id: pages
        uses: actions/configure-pages@v5
      - run: bun install --frozen-lockfile
      - name: Build static site
        env:
          FISHFACE_API_ORIGIN: ${{ vars.FISHFACE_API_ORIGIN }}
          FISHFACE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: bun run build-gh-static
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
