# Linux Azure Functions custom handler; Node.js is included in the deployment.
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Azure Function App - fishface

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

env:
  NODE_VERSION: '22.x'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4


      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2

      - name: Build Next.js API server
        shell: bash
        run: |
          bun install --frozen-lockfile
          bun test
          bun run build

      - name: Zip artifact for deployment
        shell: bash
        run: |
          mkdir runtime
          cp "$(command -v node)" runtime/node
          chmod +x runtime/node
          zip -r release.zip .next node_modules public package.json next.config.mjs host.json nextApi runtime -x '.next/cache/*'

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A730925492C54096986E878D05FC9B5C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4FA5658816CB4A34997206694DBCA651 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D2D4D4E366E6426DA2AB4C5AB1DDC143 }}

      - name: Configure custom handler and Pages CORS
        shell: bash
        env:
          SITE_ORIGIN: ${{ vars.FISHFACE_SITE_ORIGIN || format('https://{0}.github.io', github.repository_owner) }}
        run: |
          resource_group=$(az functionapp list --query "[?name=='fishface'].resourceGroup | [0]" -o tsv)
          test -n "$resource_group"
          test "$(az functionapp show -g "$resource_group" -n fishface --query reserved -o tsv)" = "true"
          az functionapp config appsettings set -g "$resource_group" -n fishface --settings FUNCTIONS_WORKER_RUNTIME=Custom --output none
          az functionapp cors add -g "$resource_group" -n fishface --allowed-origins "$SITE_ORIGIN" --output none

      - name: 'Run Azure Functions Action'
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: 'fishface'
          slot-name: 'Production'
          package: release.zip

